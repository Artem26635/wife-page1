<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MY LOVE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/love.css">
  <script src="/json/love.js" defer></script>
</head>
<body>
  
  <!-- Header -->
  
  <header class="header">
    <div class="container">
      <h1 class="text-h1 header-h1">Каждый день с тобой — лучший подарок. С годовщиной, моя любовь!</h1>
    </div>
        
  </header>
  
  <!-- Main -->
  
  <main class="main">
    <div class="container">
      <div class="grid-container">
        <!-- card_1 -->
        <div class="grid-item">
          <button class="btn-card">
            <img class="img-card" src="/img/love1.jpg" alt="Image-1">
            <p class="p-card p-text">Прекрасная дама и кавалер</p>
          </button>
        </div>
        <!-- card_2 -->
        <div class="grid-item">
          <button class="btn-card">
            <img class="img-card" src="/img/love2.jpg" alt="Image-2">
            <p class="p-card p-text">Взрыв чувств, осветивший зал</p>
          </button>
        </div>
        <!-- card_3 -->
        <div class="grid-item">
          <button class="btn-card">
            <img class="img-card" src="/img/love3.jpg" alt="Image-3">
            <p class="p-card p-text">Хулиганы успешно свалили из города</p>
          </button>
        </div>
        <!-- card_4 -->
        <div class="grid-item">
          <button class="btn-card">
            <img class="img-card" src="/img/love4.jpg" alt="Image-4">
            <p class="p-card p-text">Было очень волнительно, забыл слова и вообще как дышать. Будь моей женой</p>
          </button>
        </div>
        <!-- card_5 -->
        <div class="grid-item">
          <button class="btn-card">
            <img class="img-card" src="/img/love5.jpg" alt="Image-5">
            <p class="p-card p-text">Такая нереальная красота и это всё для меня. Что может быть лучше (Ничего естественно)</p>
          </button>
        </div>
        <!-- card_6 -->
        <div class="grid-item">
          <button class="btn-card">
            <img class="img-card" src="/img/love6.jpg" alt="Image-6">
            <p class="p-card p-text">Было пипец дубачело, после которого было приятно погреться в твоих объятиях</p>
          </button>
        </div>
        <!-- card_7 -->
        <div class="grid-item">
          <button class="btn-card">
            <img class="img-card" src="/img/love7.jpg" alt="Image-7">
            <p class="p-card p-text">Немного веселья в ожидании чуда</p>
          </button>
        </div>
        <!-- card_8 -->
        <div class="grid-item">
          <button class="btn-card">
            <img class="img-card" src="/img/love8.jpg" alt="Image-8">
            <p class="p-card p-text">Рождение звезды во вселенной. Ты подарила нам самое большое маленькое чудо</p>
          </button>
        </div>
        <!-- card_9 -->
        <div class="grid-item">
          <button class="btn-card">
            <img class="img-card" src="/img/love9.jpg" alt="Image-9">
            <p class="p-card p-text">Мама, Папа, Я и тортек (Бабуленька нас фоткает)</p>
          </button>
        </div>
        <!-- card_10 -->
        <div class="grid-item">
          <button class="btn-card">
            <img class="img-card " src="/img/love91.jpg" alt="Image-10">
            <p class="p-card p-text">Прогулка с Бабуленькой</p>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer"></footer>
</body>
</html>
